services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # documents to ingest (bind-mount your local data dir)
      - kc_chroma:/app/chroma_db  # vector store — persists across restarts
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  kc_chroma:
  ollama_models:
